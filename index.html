if(!window.SUPABASE_URL || !SUPABASE_URL.startsWith('http')){   
  $('#root').innerHTML=`<div class="config-warn"><h2>⚠ Falta configurar as chaves</h2>
      <p>Abra este arquivo <code>index.html</code> em um editor de texto e cole sua <code>SUPABASE_URL</code> e <code>SUPABASE_ANON</code> no topo, conforme o guia de instalação. Depois salve e suba de novo.</p></div>`;
    return;
  }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

  /* ---------- helpers ---------- */
  function toast(msg){const t=document.createElement('div');t.className='toast';t.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'+esc(msg);$('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);}
  function ago(ts){const s=Math.floor((Date.now()-new Date(ts).getTime())/1000);if(s<60)return'agora';const m=(s/60)|0;if(m<60)return m+'min';const h=(m/60)|0;if(h<24)return h+'h';return((h/24)|0)+'d';}
  function dt(ts){const d=new Date(ts);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
  function stCls(s){return s==='Em atendimento'?'andamento':s;}
  function getMine(){try{return JSON.parse(localStorage.getItem('cc_meus')||'[]');}catch(e){return[];}}
  function setMine(a){localStorage.setItem('cc_meus',JSON.stringify(a));}

  /* ---------- image compression ---------- */
  function compressImage(file){return new Promise(res=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=1280;let w=img.width,h=img.height;if(w>h&&w>max){h=h*max/w;w=max;}else if(h>max){w=w*max/h;h=max;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);c.toBlob(b=>res(b),'image/jpeg',0.62);};img.onerror=()=>{URL.revokeObjectURL(url);res(null);};img.src=url;});}

        <div class="row2">

            <select class="control" id="f-area"><option value="">Selecione...</option>
              <option>Recebimento</option><option>Endereçamento</option><option>Separação</option><option>Conferência</option><option>Expedição</option><option>Contagem / Auditoria</option><option>Sistema / WMS</option><option>Equipamento / Coletor</option><option>Outro</option></select></div>
          <div class="field"><label>Tipo</label>

  async function handleFiles(files){
    for(const f of files){
      if(f.type.startsWith('image/')){
        if(attachments.filter(a=>a.type==='img').length>=6){toast('Máximo de 6 fotos');continue;}
        const blob=await compressImage(f);if(blob)attachments.push({type:'img',blob,url:URL.createObjectURL(blob),ext:'jpg',mime:'image/jpeg'});
      }else if(f.type.startsWith('video/')){
        if(attachments.some(a=>a.type==='vid')){toast('Apenas 1 vídeo por chamado');continue;}
        if(f.size>30*1024*1024){toast('Vídeo muito grande (máx ~30MB)');continue;}
        attachments.push({type:'vid',blob:f,url:URL.createObjectURL(f),ext:(f.name.split('.').pop()||'mp4'),mime:f.type||'video/mp4'});
      }
    }
    renderThumbs();
  }
  function renderThumbs(){const w=$('#thumbs');if(!w)return;w.innerHTML='';attachments.forEach((a,i)=>{const d=document.createElement('div');d.className='thumb';d.innerHTML=a.type==='img'?`<img src="${a.url}"><div class="rm" data-i="${i}">&times;</div>`:`<video src="${a.url}" muted></video><div class="vbadge">VÍDEO</div><div class="rm" data-i="${i}">&times;</div>`;w.appendChild(d);});w.querySelectorAll('.rm').forEach(b=>b.addEventListener('click',()=>{attachments.splice(+b.dataset.i,1);renderThumbs();}));}

  async function submit(){
    const autor=$('#f-autor').value.trim(),area=$('#f-area').value,desc=$('#f-desc').value.trim();
    if(!autor){toast('Informe seu nome');$('#f-autor').focus();return;}
    if(!area){toast('Selecione a área');$('#f-area').focus();return;}
    if(!desc){toast('Descreva o problema');$('#f-desc').focus();return;}
    const btn=$('#btn-submit');btn.disabled=true;btn.innerHTML='Enviando...';
    try{
      const folder=(crypto.randomUUID?crypto.randomUUID():('f'+Date.now()));
      const anexos=[];let i=0;
      for(const a of attachments){
        const path=`${folder}/${i++}.${a.ext}`;
        const {error}=await sb.storage.from('anexos').upload(path,a.blob,{contentType:a.mime,upsert:false});
        if(!error)anexos.push({tipo:a.type,path});
      }
      const {data,error}=await sb.from('chamados').insert({
        titulo:area+' · '+$('#f-tipo').value,area,tipo:$('#f-tipo').value,prioridade:prio,
        descricao:desc,autor,status:'Aberto',anexos
      }).select('protocolo,titulo').single();
      if(error)throw error;
      const mine=getMine();mine.unshift({protocolo:data.protocolo,titulo:data.titulo});setMine(mine.slice(0,30));
      $('#root').querySelector('.wrap').innerHTML=`<div class="card"><div class="success">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
        <h2>Chamado enviado!</h2><p>A equipe já consegue ver. Guarde o protocolo para acompanhar.</p>
        <div class="protobox"><div class="l">Protocolo</div><div class="p">${esc(data.protocolo)}</div></div>
        <button class="ghost-btn" id="btn-new">Abrir outro chamado</button></div></div>`;
      $('#btn-new').addEventListener('click',renderReport);
    }catch(e){
      console.error(e);toast('Erro ao enviar. Tente novamente.');btn.disabled=false;
      btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg> Enviar chamado';
    }
  }

  async function renderMine(){
    const w=$('#mine-list');if(!w)return;
    const mine=getMine();
    if(!mine.length){w.innerHTML='<div class="mine-empty">Os chamados que você enviar deste aparelho aparecem aqui.</div>';return;}
    w.innerHTML=mine.map(m=>`<div class="mine-item" data-p="${esc(m.protocolo)}"><div class="pr">${esc(m.protocolo)}</div><div class="tt">${esc(m.titulo)}</div><div class="meta"><span class="st">carregando...</span></div></div>`).join('');
    for(const m of mine){
      try{const {data}=await sb.rpc('acompanhar',{p_protocolo:m.protocolo});const t=data&&data[0];
        const el=w.querySelector(`[data-p="${CSS.escape(m.protocolo)}"] .meta`);
        if(el)el.innerHTML=t?`<span class="badge b-${esc(stCls(t.status))}"><span class="dot"></span>${esc(t.status)}</span><span>${t.assumido_por?('por <b style="color:var(--tx)">'+esc(t.assumido_por)+'</b>'):'aguardando'}</span>`:'<span class="mine-empty" style="padding:0">não encontrado</span>';
      }catch(e){}
    }
  }
  async function lookup(){
    const p=$('#f-lookup').value.trim().toUpperCase(),w=$('#lookup-res');
    if(!p)return;
    try{const {data}=await sb.rpc('acompanhar',{p_protocolo:p});const t=data&&data[0];
      w.innerHTML=t?`<div class="mine-item"><div class="pr">${esc(t.protocolo)}</div><div class="tt">${esc(t.titulo)}</div><div class="meta"><span class="badge b-${esc(stCls(t.status))}"><span class="dot"></span>${esc(t.status)}</span><span>${t.assumido_por?('por <b style="color:var(--tx)">'+esc(t.assumido_por)+'</b>'):'aguardando'}</span></div></div>`:'<div class="mine-empty">Protocolo não encontrado.</div>';
    }catch(e){w.innerHTML='<div class="mine-empty">Erro na busca.</div>';}
  }

  async function loadTickets(){
    const {data,error}=await sb.from('chamados').select('*').order('criado_em',{ascending:false});
    tickets=error?[]:(data||[]);
  }
  function renderStats(){
    const ab=tickets.filter(t=>t.status==='Aberto').length, at=tickets.filter(t=>t.status==='Em atendimento').length;
    const d0=new Date();d0.setHours(0,0,0,0);
    const rs=tickets.filter(t=>t.status==='Resolvido'&&t.resolvido_em&&new Date(t.resolvido_em)>=d0).length;
    const cr=tickets.filter(t=>(t.status==='Aberto'||t.status==='Em atendimento')&&t.prioridade==='Crítica').length;
    $('#stats').innerHTML=`<div class="stat s-a"><div class="n">${ab}</div><div class="lbl">Abertos</div></div><div class="stat s-b"><div class="n">${at}</div><div class="lbl">Em atendimento</div></div><div class="stat s-g"><div class="n">${rs}</div><div class="lbl">Resolvidos hoje</div></div><div class="stat s-r"><div class="n">${cr}</div><div class="lbl">Críticos abertos</div></div>`;
  }
  function renderList(){
    const q=($('#flt-q').value||'').toLowerCase(),fs=$('#flt-status').value,fa=$('#flt-area').value,fp=$('#flt-prio').value;
    const prO={'Crítica':0,'Alta':1,'Média':2,'Baixa':3},stO={'Aberto':0,'Em atendimento':1,'Resolvido':2,'Cancelado':3};
    let list=tickets.filter(t=>{if(fs&&t.status!==fs)return false;if(fa&&t.area!==fa)return false;if(fp&&t.prioridade!==fp)return false;
      if(q){const h=(t.protocolo+' '+t.titulo+' '+t.descricao+' '+t.autor+' '+(t.assumido_por||'')).toLowerCase();if(!h.includes(q))return false;}return true;});
    list.sort((a,b)=>(stO[a.status]-stO[b.status])||(prO[a.prioridade]-prO[b.prioridade])||(new Date(b.criado_em)-new Date(a.criado_em)));
    const w=$('#ticket-list');
    if(!list.length){w.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg><div class="et">Nenhum chamado por aqui</div></div>`;return;}
    w.innerHTML=list.map(t=>{
      const nFotos=(t.anexos||[]).filter(a=>a.tipo==='img').length, temVid=(t.anexos||[]).some(a=>a.tipo==='vid');
      const media=(nFotos?`<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>${nFotos}</span>`:'')+(temVid?`<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>vídeo</span>`:'');
      return `<div class="tk ${t.prioridade==='Crítica'?'crit':''}" data-id="${t.id}">
        <div class="lp"><span class="proto">${esc(t.protocolo)}</span><span class="prioBadge pr-${esc(t.prioridade)}">${esc(t.prioridade)}</span></div>
        <div class="mid"><div class="tt">${esc(t.titulo)}</div><div class="sub">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${esc(t.autor)}</span>${media}
          <span style="color:var(--dim2)">${esc((t.descricao||'').slice(0,70))}${(t.descricao||'').length>70?'…':''}</span></div></div>
        <div class="rp"><span class="badge b-${esc(stCls(t.status))}"><span class="dot"></span>${esc(t.status)}</span>
          ${t.assumido_por?`<span class="assignee">por <b>${esc(t.assumido_por)}</b></span>`:'<span class="assignee" style="color:var(--dim2)">não atribuído</span>'}
          <span class="age">há ${ago(t.criado_em)}</span></div></div>`;
    }).join('');
    w.querySelectorAll('.tk').forEach(el=>el.addEventListener('click',()=>openDetail(el.dataset.id)));
  }

  async function openDetail(id){
    const t=tickets.find(x=>x.id===id);if(!t)return;
    const urls=[];
    for(const a of (t.anexos||[])){
      try{const {data}=await sb.storage.from('anexos').createSignedUrl(a.path,3600);if(data)urls.push({tipo:a.tipo,url:data.signedUrl});}catch(e){}
    }
    window.__media=urls;
    const gal=urls.map((m,i)=>m.tipo==='img'?`<div class="gi" data-z="img" data-i="${i}"><img src="${m.url}"></div>`:`<div class="gi vid" data-z="vid" data-i="${i}"><video src="${m.url}" muted></video></div>`).join('');
    const canTake=t.status==='Aberto', canDone=(t.status==='Aberto'||t.status==='Em atendimento');
    const ov=document.createElement('div');ov.className='overlay';ov.id='modal-ov';
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
    ov.innerHTML=`<div class="modal"><div class="modal-top"><div><div class="proto">${esc(t.protocolo)}</div><h2>${esc(t.titulo)}</h2></div><div class="x" id="m-x">&times;</div></div>
      <div class="modal-body">
        <div class="mrow"><span class="badge b-${esc(stCls(t.status))}"><span class="dot"></span>${esc(t.status)}</span><span class="prioBadge pr-${esc(t.prioridade)}">${esc(t.prioridade)}</span></div>
        <div class="mlabel">Descrição</div><div class="desc">${esc(t.descricao)}</div>
        ${gal?`<div class="mlabel" style="margin-top:18px">Anexos</div><div class="gallery">${gal}</div>`:''}
        <div class="info-grid">
          <div class="ig"><div class="k">Aberto por</div><div class="v">${esc(t.autor)}</div></div>
          <div class="ig"><div class="k">Área</div><div class="v">${esc(t.area)}</div></div>
          <div class="ig"><div class="k">Aberto em</div><div class="v" style="font-size:13px">${dt(t.criado_em)}</div></div>
          <div class="ig"><div class="k">Responsável</div><div class="v">${t.assumido_por?esc(t.assumido_por):'—'}</div></div>
        </div>
        ${t.nota_resolucao?`<div class="resol"><div class="rl">Resolução</div>${esc(t.nota_resolucao)}</div>`:''}
        <div class="actions">
          ${canTake?`<button class="act act-take" data-a="take"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Pegar chamado</button>`:''}
          ${canDone?`<button class="act act-done" data-a="done">Marcar resolvido</button>`:''}
          ${(t.status==='Resolvido'||t.status==='Cancelado')?`<button class="act act-reopen" data-a="reopen">Reabrir</button>`:''}
          ${(t.status!=='Cancelado'&&t.status!=='Resolvido')?`<button class="act act-cancel" data-a="cancel">Cancelar</button>`:''}
        </div></div></div>`;
    document.body.appendChild(ov);
    $('#m-x').addEventListener('click',()=>ov.remove());
    ov.querySelectorAll('.gi').forEach(g=>g.addEventListener('click',()=>zoom(g.dataset.z,+g.dataset.i)));
    ov.querySelectorAll('.act').forEach(b=>b.addEventListener('click',()=>action(id,b.dataset.a)));
  }
  function zoom(type,i){const m=window.__media[i];const lb=document.createElement('div');lb.className='lightbox';lb.addEventListener('click',e=>{if(e.target===lb||e.target.classList.contains('lx'))lb.remove();});lb.innerHTML='<div class="lx">&times;</div>'+(type==='img'?`<img src="${m.url}">`:`<video src="${m.url}" controls autoplay></video>`);document.body.appendChild(lb);}

  async function action(id,a){
    const name=session.user.email;
    let upd=null;
    if(a==='take'){upd={status:'Em atendimento',assumido_por:name,assumido_em:new Date().toISOString()};}
    else if(a==='done'){const nota=prompt('Como foi resolvido? (opcional)','');upd={status:'Resolvido',resolvido_em:new Date().toISOString()};const cur=tickets.find(x=>x.id===id);if(cur&&!cur.assumido_por){upd.assumido_por=name;upd.assumido_em=new Date().toISOString();}if(nota&&nota.trim())upd.nota_resolucao=nota.trim();}
    else if(a==='reopen'){const cur=tickets.find(x=>x.id===id);upd={status:cur&&cur.assumido_por?'Em atendimento':'Aberto',resolvido_em:null};}
    else if(a==='cancel'){if(!confirm('Cancelar este chamado?'))return;upd={status:'Cancelado'};}
    const {error}=await sb.from('chamados').update(upd).eq('id',id);
    const ov=$('#modal-ov');if(ov)ov.remove();
    if(error){toast('Não foi possível atualizar');return;}
    toast(a==='take'?'Chamado atribuído a você':a==='done'?'Marcado como resolvido':a==='reopen'?'Chamado reaberto':'Chamado cancelado');
    await loadTickets();renderStats();renderList();
  }

  /* ---------- boot ---------- */
  (async()=>{
    const {data}=await sb.auth.getSession();session=data.session||null;
    sb.auth.onAuthStateChange((_e,s)=>{session=s;});
    route();
  })();
})();
</script>
</body>
</html>
